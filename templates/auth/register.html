{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<title>Vinnie Market</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
      <link rel="stylesheet" type="text/css" href="{% static 'css/util.css' %}">
      <link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
      <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

      <style>
          * {
  box-sizing: border-box;
}

body {
  background-color: #f2f2f2;
  font-family: Arial, sans-serif;
  margin: 0;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

form {
  background-color: #ffffff;
  border-radius: 5px;
  box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
  padding: 60px;
  width: 400px;
}

h1 {
  text-align: center;
}

.input-field {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 5px;
}

input[type="text"],
input[type="password"] {
  border: none;
  border-bottom: 2px solid #d9d9d9;
  outline: none;
  padding: 5px 10px;
  width: 100%;
}

input[type="text"]:focus,
input[type="password"]:focus {
  border-bottom: 2px solid #717fe0;
}

.btn {
  border-radius: 5px;
  border: none;
  color: #ffffff;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  padding: 10px 20px;
  transition: all 0.3s ease;
}
button[type="submit"] {
  width: 100%;
  background-color: #605cff;
  border-color: #605cff;
}

button[type="submit"]:hover {
  background-color: #4c48db;
  border-color: #4c48db;

}


      h1 {
        font-size: 2rem;
        margin-top: 0.0cm;
        text-align: center;
      }

      .btn-social {
        margin-right: 1rem;
        margin-bottom: 2rem;
        background-color: transparent;
        border-color: #605cff;
        color: #605cff;
      }

      .btn-social:hover {
        color: #fff;
      }

      .btn-social.google:hover {
        background-color: #dc3545;
        border-color: #dc3545;
      }

      .btn-social.telegram:hover {
        background-color: #007bff;
        border-color: #007bff;
      }

      form {
        margin-top: 2rem;
        text-align: center;
      }

      input[type="text"],
      input[type="password"] {
        border-color: #605cff !important;
        box-shadow: none !important;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: #605cff !important;
        box-shadow: none !important;
      }

      .btn-primary {
        background-color: #605cff;
        border-color: #605cff;
        width: 100%;
      }

    </style>
  </head>
  <body>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form>
            <h1 class="text-center mb-4">Авторизация</h1>
            <div class="d-flex align-items-center justify-content-center flex-column">
              <div class="d-flex">
                <a href="#" class="btn btn-outline-primary btn-social google"><i class="fab fa-google"></i> Google</a>
                <a href="#" class="btn btn-outline-primary btn-social telegram"><i class="fab fa-telegram-plane"></i> Telegram</a>
              </div>
            </div>


            <div class="form-group mt-4">
              <label for="inputUsername" style="color: #000;">Логин</label>
              <input type="text" class="form-control" id="inputUsername" placeholder="Введите логин">
            </div>
            <div class="form-group">
              <label for="inputPassword" style="color: #000;">Пароль</label>
              <input type="password" class="form-control" id="inputPassword" placeholder="Введите пароль">
            </div>


            <button type="submit"  class="btn btn-primary mt-4">Войти</button>
            <div class="mt-3 text-center">
              Нет аккаунта? <a href="https://example.com/register" style="color: #605cff;">Зарегистрируйтесь</a>
</div>
</form>
</div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
